<div class="ce-tournament-field{% if field.errors %} ce-tournament-field-invalid{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="ce-tournament-required">(required)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p id="{{ field.auto_id }}_helptext" class="ce-tournament-field-hint">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<ul id="{{ field.auto_id }}_error" class="ce-tournament-field-errors">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
