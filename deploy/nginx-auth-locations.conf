
# CE ARENA AUTHENTICATION ROUTES
# STAGED ONLY — NOT ACTIVE IN PRODUCTION
#
# Install inside the existing Nginx server block
# only after the production Django deployment is ready.

location = /accounts {
    access_log off;
    return 308 https://13.51.56.236/accounts/login/;
}

location = /dashboard {
    access_log off;
    return 308 https://13.51.56.236/dashboard/;
}

location ^~ /accounts/ {
    access_log off;

    # The live server currently handles both HTTP and HTTPS.
    if ($scheme = http) {
        return 308 https://13.51.56.236$request_uri;
    }

    proxy_pass http://127.0.0.1:8011;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    client_max_body_size 64k;
    proxy_read_timeout 30s;
}

location ^~ /dashboard/ {
    access_log off;

    # The live server currently handles both HTTP and HTTPS.
    if ($scheme = http) {
        return 308 https://13.51.56.236$request_uri;
    }

    proxy_pass http://127.0.0.1:8011;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    client_max_body_size 64k;
    proxy_read_timeout 30s;
}
